<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cursor Translator — PDF</title>
<link rel="stylesheet" href="../options.css">
<link rel="stylesheet" href="vendor/pdf_viewer.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body class="pdfpage">
<div class="pdfbar">
  <button id="open" type="button">open</button>
  <input type="file" id="file" accept="application/pdf,.pdf" hidden>
  <!-- 未保存のときは名前のうしろに * が付く。札を別に置くより場所を取らない -->
  <span id="name" class="pdfname"></span>

  <button id="marker" type="button" title="Highlight the selection (right-click works too)">highlight</button>
  <input type="color" id="color" value="#ff777a" title="Highlight colour">

  <select id="page" title="Page"></select>
  <span class="pdfzoom">
    <button id="out" type="button" title="Zoom out">−</button>
    <b id="scale" class="val">—</b>
    <button id="in" type="button" title="Zoom in">＋</button>
  </span>

  <button id="vocab" type="button" aria-expanded="false">vocabulary</button>
  <button id="save" type="button">save</button>
</div>
<div id="note" class="pdfnote" hidden>
  <span id="note-text"></span>
  <button id="note-close" type="button" title="Dismiss" aria-label="Dismiss">×</button>
</div>

<div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div>

<!-- 引いた線の一覧。右から出す -->
<aside id="vocabulary" class="pdfside" hidden aria-label="Vocabulary">
  <div class="pdfside-head">
    <b>vocabulary</b>
    <span id="vocab-count" class="val"></span>
    <button id="vocab-close" type="button" title="Close">×</button>
  </div>
  <ul id="vocab-list" class="pdfside-list"></ul>
  <p id="vocab-empty" class="pdfside-empty">Nothing highlighted yet.</p>
</aside>

<!-- 線を引いたところを押すと出る、注釈の書き込み欄 -->
<div id="editor" class="pdfeditor" hidden>
  <textarea id="text" rows="3" placeholder="Note for this highlight"></textarea>
  <div class="pdfeditor-row">
    <button id="apply" type="button">apply</button>
    <button id="drop" type="button">delete</button>
    <button id="close" type="button">close</button>
  </div>
</div>

<script src="../common.js"></script>
<script src="viewer.js" type="module"></script>
<script src="../content.js"></script>
</body>
</html>
